<!doctype html><html><head><meta charset="utf-8"></head><body><script>
const config = <?!= config ?>;
let peer;
window.addEventListener('message', event => {
  const data = event.data;
  if (event.origin !== config.origin || !data || data.channel !== config.channel || data.type !== 'queue-request') return;
  if (peer && event.source !== peer) return;
  peer = event.source;
  const reply = payload => peer.postMessage({ channel: config.channel, type: 'queue-response', id: data.id, ...payload }, config.origin);
  google.script.run.withSuccessHandler(result => reply({ result })).withFailureHandler(error => reply({ error: error.message || String(error) })).queueRequest(data.request);
});
// HtmlService's sandbox is nested inside Google's wrapper; top is the worker app.
window.top.postMessage({ type: 'queue-ready', channel: config.channel }, config.origin);
</script></body></html>
